logging:
  level: info
  format: text
  add_source: false

database:
  url: postgres://postgres:postgres@127.0.0.1:5432/gpu_telemetry?sslmode=disable

queue:
  data_dir: ./data/queue
  partitions: 4
  segment_size_bytes: 67108864

  replication:
    factor: 3
    required_follower_acks: 2

streamer:
  spool_dir: ./data/streamer-spool
  max_spool_bytes: 1073741824
  retry_initial: 1s
  retry_max: 30s

collector:
  workers: 2

processor:
  poll_interval: 250ms
  retry_interval: 1s

api:
  host: 0.0.0.0
  port: 8080

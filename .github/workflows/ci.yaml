name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-coverage:
    name: Test and Coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_total: ${{ steps.coverage.outputs.total }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with coverage
        run: make coverage

      - name: Verify generated OpenAPI spec is up to date
        run: |
          make swagger
          git diff --exit-code -- docs/openapi.json

      - name: Capture coverage
        id: coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Summarize coverage
        run: |
          total='${{ steps.coverage.outputs.total }}'
          echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Total: \`$total\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage.out
          path: coverage.out

  build-images:
    name: Build ${{ matrix.component }} image
    runs-on: ubuntu-latest
    needs: test-and-coverage
    strategy:
      fail-fast: false
      matrix:
        component:
          - queue
          - streamer
          - processor
          - api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: false
          provenance: false
          platforms: linux/amd64
          build-args: |
            COMPONENT=${{ matrix.component }}
          tags: gpu-telemetry-${{ matrix.component }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-coverage-badge:
    name: Update Coverage Badge
    runs-on: ubuntu-latest
    needs: test-and-coverage
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Render coverage badge
        env:
          COVERAGE_TOTAL: ${{ needs.test-and-coverage.outputs.coverage_total }}
        run: |
          mkdir -p docs/badges

          value="${COVERAGE_TOTAL%%%}"
          color=$(awk -v v="$value" 'BEGIN { if (v >= 80) print "4c1"; else if (v >= 60) print "dfb317"; else print "e05d44" }')

          cat > docs/badges/coverage.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="116" height="20" role="img" aria-label="coverage: ${COVERAGE_TOTAL}">
            <title>coverage: ${COVERAGE_TOTAL}</title>
            <linearGradient id="s" x2="0" y2="100%">
              <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
              <stop offset="1" stop-opacity=".1"/>
            </linearGradient>
            <clipPath id="r">
              <rect width="116" height="20" rx="3" fill="#fff"/>
            </clipPath>
            <g clip-path="url(#r)">
              <rect width="63" height="20" fill="#555"/>
              <rect x="63" width="53" height="20" fill="#${color}"/>
              <rect width="116" height="20" fill="url(#s)"/>
            </g>
            <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="11">
              <text x="32.5" y="15" fill="#010101" fill-opacity=".3">coverage</text>
              <text x="32.5" y="14">coverage</text>
              <text x="88.5" y="15" fill="#010101" fill-opacity=".3">${COVERAGE_TOTAL}</text>
              <text x="88.5" y="14">${COVERAGE_TOTAL}</text>
            </g>
          </svg>
          EOF

      - name: Commit updated badge
        run: |
          if git diff --quiet -- docs/badges/coverage.svg; then
            echo "Coverage badge unchanged"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/badges/coverage.svg
          git commit -m "chore: update coverage badge [skip ci]"
          git push

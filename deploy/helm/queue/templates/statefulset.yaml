apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "queue.fullname" . }}
  labels:
    {{- include "queue.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "queue.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel

  selector:
    matchLabels:
      {{- include "queue.labels" . | nindent 6 }}

  template:
    metadata:
      labels:
        app: gpu-telemetry-queue
        {{- include "queue.labels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "queue.fullname" . }}

      containers:
        - name: queue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.service.port }}

          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

            - name: QUEUE_CONFIG
              value: /etc/queue/config.yaml

            - name: QUEUE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace

            - name: QUEUE_POD_SELECTOR
              value: "app=gpu-telemetry-queue"

            - name: QUEUE_SERVICE
              value: {{ include "queue.fullname" . | quote }}

          volumeMounts:
            - name: config
              mountPath: /etc/queue
              readOnly: true

            - name: data
              mountPath: /var/lib/queue

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

      volumes:
        - name: config
          configMap:
            name: {{ include "queue.fullname" . }}-config

  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.storage.storageClass }}
        storageClassName: {{ .Values.storage.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.storage.size }}
replicaCount: 1

image:
  repository: shubhindia/gpu-telemetry-queue
  tag: latest
  pullPolicy: Always

queue:
  partitions: 4
  segmentSizeBytes: "67108864"

  replication:
    factor: 1
    requiredFollowerAcks: 0

storage:
  size: 1Gi
  storageClass: ""

service:
  port: 8080

podSelector:
  app: gpu-telemetry-queue

metrics:
  enabled: true
  path: /metrics

podAnnotations: {}

resources: {}

replicaCount: 1

image:
  repository: shubhindia/gpu-telemetry-api
  tag: latest
  pullPolicy: Always

database:
  url: postgres://postgres:postgres@postgres-postgres:5432/gpu_telemetry?sslmode=disable

logging:
  level: info
  format: text
  addSource: false

service:
  type: ClusterIP
  port: 8080

config:
  queue:
    dataDir: /var/lib/queue
    partitions: 1
    segmentSizeBytes: "67108864"

    replication:
      factor: 1
      requiredFollowerAcks: 0

  streamer:
    spoolDir: /var/lib/streamer-spool
    maxSpoolBytes: "1073741824"
    retryInitial: 1s
    retryMax: 30s

  collector:
    workers: 1

  processor:
    pollInterval: 250ms
    retryInterval: 1s

  api:
    host: 0.0.0.0
    port: 8080

resources: {}

podAnnotations: {}

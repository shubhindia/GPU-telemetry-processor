apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "processor.fullname" . }}-config
  labels:
    {{- include "processor.labels" . | nindent 4 }}
data:
  config.yaml: |
    logging:
      level: {{ .Values.logging.level }}
      format: {{ .Values.logging.format }}
      add_source: {{ .Values.logging.addSource }}

    database:
      url: {{ .Values.database.url }}

    queue:
      data_dir: {{ .Values.config.queue.dataDir }}
      partitions: {{ .Values.config.queue.partitions }}
      segment_size_bytes: {{ printf "%d" (int64 .Values.config.queue.segmentSizeBytes) }}
      replication:
        factor: {{ .Values.config.queue.replication.factor }}
        required_follower_acks: {{ .Values.config.queue.replication.requiredFollowerAcks }}

    streamer:
      spool_dir: {{ .Values.config.streamer.spoolDir }}
      max_spool_bytes: {{ printf "%d" (int64 .Values.config.streamer.maxSpoolBytes) }}
      retry_initial: {{ .Values.config.streamer.retryInitial }}
      retry_max: {{ .Values.config.streamer.retryMax }}

    collector:
      workers: {{ .Values.config.collector.workers }}

    processor:
      poll_interval: {{ .Values.config.processor.pollInterval }}
      retry_interval: {{ .Values.config.processor.retryInterval }}

    api:
      host: {{ .Values.config.api.host }}
      port: {{ .Values.config.api.port }}

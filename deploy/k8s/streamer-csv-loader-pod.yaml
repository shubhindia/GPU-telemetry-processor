apiVersion: v1
kind: Pod
metadata:
  name: dcgm-metrics-loader
spec:
  restartPolicy: Never
  containers:
    - name: loader
      image: busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: csv
          mountPath: /mnt/csv
  volumes:
    - name: csv
      persistentVolumeClaim:
        claimName: dcgm-metrics-pvc

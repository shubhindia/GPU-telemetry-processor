apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: GPU Telemetry Dashboards
        orgId: 1
        folder: GPU Telemetry
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-queue
data:
  queue-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(queue_messages_published_total)", "refId": "A"}],
          "title": "Cluster Published Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "id": 2,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(queue_messages_delivered_total)", "refId": "A"}],
          "title": "Cluster Delivered Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "id": 3,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(queue_messages_acked_total)", "refId": "A"}],
          "title": "Cluster Acked Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.001}, {"color": "red", "value": 0.01}]}, "unit": "ops"}},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "id": 4,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(rate(queue_replication_quorum_failures_total[5m]))", "refId": "A"}],
          "title": "Quorum Failures/s",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 5,
          "targets": [
            {"expr": "sum(rate(queue_messages_published_total[1m]))", "legendFormat": "published", "refId": "A"},
            {"expr": "sum(rate(queue_messages_delivered_total[1m]))", "legendFormat": "delivered", "refId": "B"},
            {"expr": "sum(rate(queue_messages_acked_total[1m]))", "legendFormat": "acked", "refId": "C"}
          ],
          "title": "Cluster Queue Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 6,
          "targets": [
            {"expr": "sum(rate(queue_replication_attempts_total[5m]))", "legendFormat": "attempts/s", "refId": "A"},
            {"expr": "sum(rate(queue_replication_successes_total[5m]))", "legendFormat": "successes/s", "refId": "B"},
            {"expr": "sum(rate(queue_replication_failures_total[5m]))", "legendFormat": "failures/s", "refId": "C"},
            {"expr": "sum(rate(queue_replication_quorum_failures_total[5m]))", "legendFormat": "quorum failures/s", "refId": "D"}
          ],
          "title": "Cluster Replication Activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "id": 7,
          "targets": [{"expr": "queue_partition_next_offset", "legendFormat": "{{instance}} p{{partition}} {{role}}", "refId": "A"}],
          "title": "Replica Offsets By Pod",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "short"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "id": 8,
          "targets": [
            {"expr": "queue_consumer_next_offset", "legendFormat": "{{group}} p{{partition}} next", "refId": "A"},
            {"expr": "queue_consumer_inflight", "legendFormat": "{{group}} p{{partition}} inflight", "refId": "B"}
          ],
          "title": "Consumer Progress",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
          "id": 9,
          "targets": [
            {"expr": "rate(queue_messages_published_total[1m])", "legendFormat": "{{instance}} published/s", "refId": "A"},
            {"expr": "rate(queue_messages_delivered_total[1m])", "legendFormat": "{{instance}} delivered/s", "refId": "B"}
          ],
          "title": "Per-Pod Queue Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
          "id": 10,
          "targets": [
            {"expr": "rate(queue_replication_attempts_total[5m])", "legendFormat": "{{instance}} attempts/s", "refId": "A"},
            {"expr": "rate(queue_replication_successes_total[5m])", "legendFormat": "{{instance}} successes/s", "refId": "B"},
            {"expr": "rate(queue_replication_failures_total[5m])", "legendFormat": "{{instance}} failures/s", "refId": "C"}
          ],
          "title": "Per-Pod Replication Activity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 28},
          "id": 11,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(processor_messages_consumed_total)", "refId": "A"}],
          "title": "Processor Consumed Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 28},
          "id": 12,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(processor_messages_processed_total)", "refId": "A"}],
          "title": "Processor Processed Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 10}]}}},
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 28},
          "id": 13,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(processor_processing_errors_total)", "refId": "A"}],
          "title": "Processor Error Total",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 0.001}, {"color": "red", "value": 0.01}]}, "unit": "ops"}},
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 28},
          "id": 14,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}},
          "targets": [{"expr": "sum(rate(processor_processing_errors_total[5m]))", "refId": "A"}],
          "title": "Processor Errors/s",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32},
          "id": 15,
          "targets": [
            {"expr": "sum(rate(processor_messages_consumed_total[1m]))", "legendFormat": "consumed", "refId": "A"},
            {"expr": "sum(rate(processor_messages_processed_total[1m]))", "legendFormat": "processed", "refId": "B"},
            {"expr": "sum(rate(processor_processing_errors_total[5m]))", "legendFormat": "errors", "refId": "C"}
          ],
          "title": "Cluster Processor Throughput",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "ops"}},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32},
          "id": 16,
          "targets": [
            {"expr": "rate(processor_messages_consumed_total[1m])", "legendFormat": "{{instance}} consumed/s", "refId": "A"},
            {"expr": "rate(processor_messages_processed_total[1m])", "legendFormat": "{{instance}} processed/s", "refId": "B"},
            {"expr": "rate(processor_processing_errors_total[5m])", "legendFormat": "{{instance}} errors/s", "refId": "C"}
          ],
          "title": "Per-Pod Processor Throughput",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["gpu-telemetry", "queue"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "timepicker": {},
      "timezone": "browser",
      "title": "Queue Overview",
      "uid": "gpu-telemetry-queue",
      "version": 1,
      "weekStart": ""
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboards-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboards-provider
          configMap:
            name: grafana-dashboards-provider
        - name: dashboards
          configMap:
            name: grafana-dashboard-queue
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
spec:
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
